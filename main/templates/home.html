{% extends 'base.html' %} {% load static %} {% block content %}
<!doctype html>
<html>
  <head>
    <style>
      /* Gradient animation */
      @keyframes gradient {
        0% {
          background-position: 0%;
        }
        50% {
          background-position: 100%;
        }
        100% {
          background-position: 0%;
        }
      }
      .navbar {
        display: flex;
      }
      .banner {
        position: relative;
        height: 90vh;
        background-image: url("{% static 'images/bannerbg3.jpg' %}");
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        padding: 80px;
        color: white;
        border-radius: 40px;
      }
      .banner .overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 1;
        border-radius: 40px;
      }
      .banner-content {
        position: relative;
        max-width: 80%;
        z-index: 2;
      }
.banner-title{

    font-size: clamp(3rem, 8vw, 7rem);

    font-weight: 800;

    letter-spacing: 3px;

    text-transform: uppercase;

    line-height: 1.1;

    position: relative;

    display: inline-block;

    background:
    linear-gradient(
    90deg,
    #ffffff,
    #7dd3fc,
    #38bdf8,
    #ffffff
    );

    background-size: 300% auto;

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation:
    gradientFlow 6s linear infinite,
    floatText 4s ease-in-out infinite,
    glowPulse 3s ease-in-out infinite;

    text-shadow:
    0 0 10px rgba(56,189,248,0.25),
    0 0 25px rgba(56,189,248,0.15);

    opacity: 0;

    transform: translateY(40px);

    animation-fill-mode: forwards;
}

/* FLOATING EFFECT */

@keyframes floatText{

    0%{
        transform: translateY(0px);
    }

    50%{
        transform: translateY(-8px);
    }

    100%{
        transform: translateY(0px);
    }
}

/* GRADIENT MOVEMENT */

@keyframes gradientFlow{

    0%{
        background-position: 0% center;
    }

    100%{
        background-position: 300% center;
    }
}

/* GLOW PULSE */

@keyframes glowPulse{

    0%{
        filter: drop-shadow(0 0 5px rgba(56,189,248,0.2));
    }

    50%{
        filter: drop-shadow(0 0 18px rgba(56,189,248,0.6));
    }

    100%{
        filter: drop-shadow(0 0 5px rgba(56,189,248,0.2));
    }
}

/* ENTRY ANIMATION */

.banner-title{

    animation:
    slideReveal 1.2s ease forwards,
    gradientFlow 6s linear infinite,
    floatText 4s ease-in-out infinite,
    glowPulse 3s ease-in-out infinite;
}

@keyframes slideReveal{

    0%{
        opacity:0;
        transform:
        translateY(60px)
        scale(0.95);

        filter:blur(10px);
    }

    100%{
        opacity:1;
        transform:
        translateY(0)
        scale(1);

        filter:blur(0);
    }
}
       .banner-title:hover{
        transform: scale(1.03);
        transition:0.4s;
}
      
      .nav-links a {
        margin-left: 25px;
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        transition: 0.3s;
      }
      .nav-links a:hover {
        color: #e22f50;
      }

      .welcome2 {
        font-family:
          Brush Script MT,
          cursive;
        display: inline-block;
        font-size: 42px;
        margin-bottom: 5px;
        padding: 8px 15px;
        position: sticky;
        border-radius: 8px;
        color: #131010cb;
        background: rgba(207, 192, 192, 0.56);
        backdrop-filter: blur(6px);
      }

      /* TAGLINE */
      .tagline {
        font-size: 18px;
        margin-bottom: 25px;
        opacity: 0.9;
      }

      /* MODERN BUTTON */
      .btn-primary {
        display: inline-block;
        padding: 12px 25px;
        font-size: 16px;
        font-weight: bold;
        text-decoration: none;
        color: white;

        border-radius: 30px;
        background: linear-gradient(45deg, #ff746f, #fd363d);

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        transition: 0.3s ease;
      }

      /* BUTTON HOVER */
      .btn-primary:hover {
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      }

      /* BUTTON CLICK */
      .btn-primary:active {
        transform: scale(0.95);
      }

      .news-section {
    margin-top: 50px;
    padding: 0 10px 60px;
  }
  .news-section-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .news-section-header h2 {
    font-size: 1.6rem;
    font-weight: 700;
    color: white;
    margin: 0;
  }
  .news-live-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff4d6d;
    box-shadow: 0 0 8px #ff4d6d;
    animation: blink 1.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes blink {
    0%,100% { opacity:1; } 50% { opacity:.2; }
  }
  .news-source-label {
    margin-left: auto;
    font-size: .78rem;
    opacity: .5;
    color: white;
  }

  /* ── CAROUSEL WRAPPER ── */
  .carousel-wrapper {
    position: relative;
    overflow: hidden;
  }
  .carousel-track {
    display: flex;
    gap: 20px;
    transition: transform .5s cubic-bezier(.4,0,.2,1);
    will-change: transform;
  }

  /* ── NEWS CARD ── */
  .news-card {
    flex: 0 0 calc(33.333% - 14px);
    min-width: 0;
    background: rgba(255,255,255,.09);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px;
    padding: 22px 24px;
    color: white;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform .25s, box-shadow .25s, border-color .25s;
    cursor: pointer;
    min-height: 180px;
  }
  .news-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 36px rgba(0,0,0,.35);
    border-color: rgba(126,232,250,.3);
  }
  .news-card-source {
    font-size: .72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #7ee8fa;
    opacity: .85;
  }
  .news-card-title {
    font-size: .95rem;
    font-weight: 600;
    line-height: 1.45;
    flex: 1;
  }
  .news-card-date {
    font-size: .74rem;
    opacity: .45;
  }
  .news-card-arrow {
    align-self: flex-end;
    font-size: .8rem;
    color: #7ee8fa;
    opacity: 0;
    transform: translateX(-6px);
    transition: .25s;
  }
  .news-card:hover .news-card-arrow {
    opacity: 1;
    transform: translateX(0);
  }

  /* ── NAV BUTTONS ── */
  .carousel-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-top: 24px;
  }
  .carousel-btn {
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid rgba(126,232,250,.25);
    background: rgba(255,255,255,.08);
    color: white; font-size: 1.1rem;
    cursor: pointer; transition: .25s;
    display: flex; align-items: center; justify-content: center;
  }
  .carousel-btn:hover {
    background: rgba(0,170,255,.2);
    border-color: rgba(126,232,250,.5);
    box-shadow: 0 0 14px rgba(0,170,255,.3);
  }
  .carousel-btn:disabled { opacity: .3; cursor: default; }

  /* dots */
  .carousel-dots {
    display: flex; gap: 7px; align-items: center;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(255,255,255,.25); transition: .3s; cursor: pointer;
  }
  .dot.active {
    background: #7ee8fa;
    box-shadow: 0 0 8px #7ee8fa;
    width: 20px;
    border-radius: 4px;
  }

  /* ── SKELETON LOADER ── */
  .skeleton-card {
    flex: 0 0 calc(33.333% - 14px);
    min-height: 180px; border-radius: 20px;
    background: rgba(255,255,255,.06);
    animation: shimmer-load 1.4s infinite;
  }
  @keyframes shimmer-load {
    0%,100% { opacity:.4; } 50% { opacity:.9; }
  }

  /* ── ERROR STATE ── */
  .news-error {
    text-align: center; padding: 40px; color: rgba(255,255,255,.5);
    font-size: .9rem;
  }

  @media (max-width: 900px) {
    .news-card { flex: 0 0 calc(50% - 10px); }
  }
  @media (max-width: 600px) {
    .news-card { flex: 0 0 90%; }
    .banner { padding: 40px 24px; height: 70vh; }
  }
    </style>
  </head>
  <body>
   <div class="particles">
    <div class="banner">
      <div class="overlay"></div>

      <div class="banner-content">
        <h1 class="banner-title">Innovator's Playground</h1>

        <p class="tagline">Connecting Ideas To Reality</p>

        <a href="/blog/create/" class="btn-primary">Post Now</a>
      </div>

  </body>
  <section class="news-section">

  <div class="news-section-header">
    <div class="news-live-dot"></div>
    <h2>Latest Tech News</h2>
    <span class="news-source-label">via Google News</span>
  </div>

  <!-- skeleton shown while loading -->
  <div class="carousel-wrapper" id="carousel-wrapper">
    <div class="carousel-track" id="carousel-track">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>

  <div class="carousel-nav" id="carousel-nav" style="display:none;">
    <button class="carousel-btn" id="prev-btn">&#8592;</button>
    <div class="carousel-dots" id="dots"></div>
    <button class="carousel-btn" id="next-btn">&#8594;</button>
  </div>

</section>
  <footer></footer>
  {% block extra_js %}
  <script>
(async () => {
  /* ── Config ── */
  const RSS_URL  = 'https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=en-US&gl=US&ceid=US:en';
  const PROXY    = 'https://api.allorigins.win/get?url=';
  const VISIBLE  = window.innerWidth < 600 ? 1 : window.innerWidth < 900 ? 2 : 3;
  const AUTO_MS  = 5000;

  const track    = document.getElementById('carousel-track');
  const nav      = document.getElementById('carousel-nav');
  const dotsEl   = document.getElementById('dots');
  const prevBtn  = document.getElementById('prev-btn');
  const nextBtn  = document.getElementById('next-btn');

  let items   = [];
  let current = 0;
  let autoTimer;

  /* ── Fetch RSS via CORS proxy ── */
  let xml;
  try {
    const res  = await fetch(PROXY + encodeURIComponent(RSS_URL));
    const json = await res.json();
    const parser = new DOMParser();
    const doc    = parser.parseFromString(json.contents, 'text/xml');
    items = [...doc.querySelectorAll('item')].slice(0, 18).map(item => ({
      title:  item.querySelector('title')?.textContent  || 'No title',
      link:   item.querySelector('link')?.textContent   || '#',
      source: item.querySelector('source')?.textContent || 'Google News',
      date:   item.querySelector('pubDate')?.textContent || '',
    }));
  } catch (e) {
    track.innerHTML = `<div class="news-error">⚠️ Could not load news. Check your connection.</div>`;
    return;
  }

  if (!items.length) {
    track.innerHTML = `<div class="news-error">No articles found.</div>`;
    return;
  }

  /* ── Build cards ── */
  track.innerHTML = items.map((item, i) => `
    <a class="news-card" href="${item.link}" target="_blank" rel="noopener">
      <span class="news-card-source">${item.source}</span>
      <span class="news-card-title">${item.title}</span>
      <span class="news-card-date">${fmtDate(item.date)}</span>
      <span class="news-card-arrow">→</span>
    </a>`).join('');

  /* ── Build dots ── */
  const pages = Math.ceil(items.length / VISIBLE);
  dotsEl.innerHTML = Array.from({length: pages}, (_, i) =>
    `<div class="dot ${i===0?'active':''}" data-i="${i}"></div>`
  ).join('');
  dotsEl.querySelectorAll('.dot').forEach(d =>
    d.addEventListener('click', () => goTo(+d.dataset.i))
  );

  nav.style.display = 'flex';

  /* ── Navigation ── */
  function goTo(page) {
    current = Math.max(0, Math.min(page, pages - 1));
    const cardW  = track.children[0].offsetWidth + 20; // gap
    track.style.transform = `translateX(-${current * VISIBLE * cardW}px)`;
    dotsEl.querySelectorAll('.dot').forEach((d, i) =>
      d.classList.toggle('active', i === current)
    );
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current >= pages - 1;
    resetAuto();
  }

  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));

  /* keyboard */
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  goTo(current - 1);
    if (e.key === 'ArrowRight') goTo(current + 1);
  });

  /* ── Auto-advance ── */
  function resetAuto() {
    clearInterval(autoTimer);
    autoTimer = setInterval(() => {
      goTo(current >= pages - 1 ? 0 : current + 1);
    }, AUTO_MS);
  }
  goTo(0);   // init

  /* pause on hover */
  track.addEventListener('mouseenter', () => clearInterval(autoTimer));
  track.addEventListener('mouseleave', resetAuto);

  /* ── Touch/swipe support ── */
  let touchStartX = 0;
  track.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
  track.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (dx < -50) goTo(current + 1);
    if (dx >  50) goTo(current - 1);
  });

  /* ── Date formatter ── */
  function fmtDate(raw) {
    if (!raw) return '';
    try {
      const d = new Date(raw);
      const diff = Date.now() - d;
      const mins = Math.floor(diff / 60000);
      if (mins < 60)   return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs  < 24)   return `${hrs}h ago`;
      return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
    } catch { return ''; }
  }
})();
</script>
